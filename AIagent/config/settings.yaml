# 全局设置
# 注意：环境变量会覆盖此配置（优先级：系统环境变量 > .env > YAML）

# Claude Code CLI配置
claude_code:
  timeout: 300
  max_concurrent: 2

# LLM默认配置
llm:
  provider: anthropic
  model: claude-sonnet-4-20250514
  max_tokens: 4096
  temperature: 0.7

# 向量数据库配置
vector_db:
  type: chromadb
  persist_dir: ./data/chroma

# 记忆系统配置
memory:
  backend: redis
  ttl: 86400

# 日志配置
logging:
  level: INFO
  dir: ./logs
  format: json
  max_size: 10MB
  backup_count: 5

# RAG配置
rag:
  chunk_size: 1000
  chunk_overlap: 200
  top_k: 5
  # Embedding 配置（可在 .env 中设置环境变量覆盖）
  # 支持 OpenAI 兼容 API，如阿里云百炼：
  # EMBEDDING_PROVIDER=openai
  # EMBEDDING_MODEL=text-embedding-v3
  # EMBEDDING_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
  # EMBEDDING_API_KEY=sk-xxxx

# Django API 集成配置
django_api:
  base_url: "http://localhost:8000"
  username: ""
  password: ""
  timeout: 30
  # RAG 检索配置
  retrieval:
    enable_rag: true
    keyword_filter_threshold: 20  # 关键词过滤后最多保留多少候选
    top_k: 10  # 向量检索返回 Top-K
    similarity_threshold: 0.5  # 相似度阈值